name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ocaml: '4.14.3'
            jsont: '0.2.0'
            bytesrw: '0.2.0'
            dune: '3.17.2'
          - ocaml: '5.3.0'
            jsont: '0.4.0'
            bytesrw: '0.3.0'
            dune: '3.24.2'
    steps:
      - uses: actions/checkout@v7
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
          JSONT_VERSION: ${{ matrix.jsont }}
          BYTESRW_VERSION: ${{ matrix.bytesrw }}
          DUNE_VERSION: ${{ matrix.dune }}
        with:
          variant: ${{ matrix.ocaml }}
          username: ${{ github.actor }}
          password: ''
      - name: Build, test and format
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
          JSONT_VERSION: ${{ matrix.jsont }}
          BYTESRW_VERSION: ${{ matrix.bytesrw }}
          DUNE_VERSION: ${{ matrix.dune }}
        run: ${{ steps.container.outputs.exec }} make build runtest format
      - name: Prepare pinned upstream corpus
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} make js.reference fixtures.fetch
      - name: Independent conformance without networking
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} make test.native.offline
      - name: Sparse large-file coverage
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} env SAFETENSORS_REQUIRE_LARGE_FILE=1 make test.large-file
      - name: Fresh standalone installation
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} env SAFETENSORS_REQUIRE_NETNS=1 make test.standalone
      - name: Store native evidence
        if: always() && matrix.ocaml == '4.14.3'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-native
          path: .cache/reports/
          if-no-files-found: warn
      - name: Verify generated files
        run: make tree.check
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        with:
          config: .devcontainer/javascript/devcontainer.json
          variant: javascript
          username: ${{ github.actor }}
          password: ''
      - name: Prepare compilers, browser and verified corpus
        run: ${{ steps.container.outputs.exec }} make -j4 js.prepare
      - name: Standalone Node, browser and installed clients
        run: ${{ steps.container.outputs.exec }} make test.javascript.offline
      - name: Store JavaScript evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-javascript
          path: .cache/reports/
          if-no-files-found: warn
      - name: Verify generated files
        run: make tree.check
  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3.0'
          opam-pin: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve current unconstrained dependencies
        run: |
          opam update
          opam install . --deps-only --with-test --yes
          opam upgrade --yes
          mkdir -p .cache/reports
          opam list --installed --columns=name,version > .cache/reports/latest-packages.txt
          opam pin list > .cache/reports/latest-pins.txt
      - name: Build, test and compare current dependencies
        run: make build runtest js.reference fixtures.fetch PYTHON=.venv/bin/python test.interop test.hub
      - name: Store latest resolver evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latest-dependencies
          path: .cache/reports/
          if-no-files-found: warn
      - name: Verify generated files
        run: make tree.check
  native-32:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit compiler prerequisites
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 'ocaml-variants.4.14.3+options,ocaml-option-32bit'
          opam-pin: false
      - name: Build native 32-bit packages
        run: |
          opam install --yes dune.3.17.2 jsont.0.2.0 bytesrw.0.2.0
          make build runtest
      - name: Check allocation limit on a real 32-bit runtime
        run: |
          mkdir -p .cache/reports
          test "$(opam exec -- ocamlc -config-var word_size)" = 32
          opam exec -- ocamlc -config > .cache/reports/32bit-compiler.txt
          opam list --installed --columns=name,version > .cache/reports/32bit-packages.txt
          SAFETENSORS_REQUIRE_LARGE_FILE=1 make test.copy-limit-32 2>&1 | tee .cache/reports/32bit-copy.txt
      - name: Store 32-bit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-32
          path: .cache/reports/
          if-no-files-found: warn
