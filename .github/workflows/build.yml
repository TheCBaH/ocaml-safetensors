name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ocaml: '4.14.3'
            jsont: '0.2.0'
            dune: '3.17.2'
          - ocaml: '5.3.0'
            jsont: '0.4.0'
            dune: '3.24.2'
    steps:
      - uses: actions/checkout@v7
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
          JSONT_VERSION: ${{ matrix.jsont }}
          DUNE_VERSION: ${{ matrix.dune }}
        with:
          variant: ${{ matrix.ocaml }}
          username: ${{ github.actor }}
          password: ''
      - name: Build, test and format
        env:
          OCAML_VERSION: ${{ matrix.ocaml }}
          JSONT_VERSION: ${{ matrix.jsont }}
          DUNE_VERSION: ${{ matrix.dune }}
        run: ${{ steps.container.outputs.exec }} make build runtest format
      - name: Prepare pinned upstream corpus
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} make js.reference fixtures.fetch
      - name: Independent conformance without networking
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} make test.native.offline
      - name: Fresh standalone installation
        if: matrix.ocaml == '4.14.3'
        run: ${{ steps.container.outputs.exec }} env SAFETENSORS_REQUIRE_NETNS=1 make test.standalone
      - name: Store native evidence
        if: always() && matrix.ocaml == '4.14.3'
        uses: actions/upload-artifact@v6
        with:
          name: standalone-native
          path: .cache/reports/
          if-no-files-found: warn
      - name: Verify generated files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: container
        with:
          config: .devcontainer/javascript/devcontainer.json
          variant: javascript
          username: ${{ github.actor }}
          password: ''
      - name: Prepare compilers, browser and verified corpus
        run: ${{ steps.container.outputs.exec }} make js.deps js.reference js.build.jsoo js.build.melange js.corpus
      - name: Standalone Node, browser and installed clients
        run: ${{ steps.container.outputs.exec }} make test.javascript.offline
      - name: Store JavaScript evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standalone-javascript
          path: .cache/reports/
          if-no-files-found: warn
      - name: Verify generated files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
